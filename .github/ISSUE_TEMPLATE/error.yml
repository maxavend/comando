name: Algo no funciona
description: Un error, un cierre inesperado o algo que se ve mal.
labels: [error]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Qué hiciste, qué esperabas y qué pasó en cambio. Si puedes, agrega una captura.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abrí una sesión en…
        2. Escribí…
        3. …
  - type: input
    id: version
    attributes:
      label: Versión de Comando
      description: Está en Comando → Acerca de Comando.
      placeholder: "1.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versión de macOS
      placeholder: "27.2"
  - type: dropdown
    id: asistente
    attributes:
      label: ¿Tiene que ver con el asistente?
      options:
        - "No"
        - "Sí, y Apple Intelligence está activado"
        - "Sí, y Apple Intelligence no está activado"
