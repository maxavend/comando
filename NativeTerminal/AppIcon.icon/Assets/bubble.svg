<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Round chat bubble with its tail at the bottom right, like a sent message.
       The tail leaves the ellipse at its rightmost point, where both edges
       are vertical, so the outline flows without a kink. -->
  <g fill="#1A7CFF">
    <ellipse cx="512" cy="480" rx="330" ry="265"/>
    <path d="M842 480 C842 620 847 716 870 770 C818 778 752 752 700 690 L640 560 Z"/>
  </g>
</svg>
